<!doctype html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d5c40">
<title>Natiijada Imtixaanka | Beder Primary and Intermediate School</title>
<link rel="icon" href="logo.jpg">
<style>
:root{--green:#0d5c40;--green2:#0a4632;--green3:#12805a;--navy:#0b2545;--navy2:#1a3a6b;--gold:#dba626;--ink:#1d2b25;--mute:#66756d;--line:#dfe8e3;--bg:#eaf2ee;--card:#fff;--tint:#f5faf7;--bad:#c0392b;--good:#1a8f5c;--warn:#d98a00;--blue:#1c6ea4}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;min-height:100vh;
  background:radial-gradient(900px 420px at 12% -80px,#cfe6da 0,transparent 70%),radial-gradient(800px 420px at 100% 0,#dbe7f7 0,transparent 70%),linear-gradient(135deg,#e8f0fe 0%,#e3f1ea 100%) fixed}
.ic{width:1.1em;height:1.1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.17em}
.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.wrap{max-width:1000px;margin:0 auto;padding:16px 14px 36px}
.langs{display:flex;justify-content:flex-end;gap:6px;margin-bottom:10px}
.langs button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.9);color:var(--mute);border-radius:22px;padding:4px 13px;font-size:13px;cursor:pointer;transition:.2s}
.langs button:hover{transform:translateY(-1px);border-color:var(--green)}
.langs button.on{background:var(--green);color:#fff;border-color:var(--green)}
.paper{background:var(--card);border-radius:24px;box-shadow:0 22px 60px rgba(0,20,50,.18),0 1px 3px rgba(0,0,0,.06);overflow:hidden;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
/* ---------- letterhead ---------- */
.lh{position:relative;padding:14px 18px 6px;text-align:center;background:linear-gradient(180deg,#f3faf6,#fff)}
.lh-img{width:100%;max-width:840px;height:auto;display:block;margin:0 auto}
.lh-text{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;padding:8px 0}
.lh-text img{width:78px;height:78px;object-fit:contain}
.lh-name{font:700 clamp(18px,4.4vw,28px)/1.15 Georgia,"Times New Roman",serif;color:var(--green);letter-spacing:.3px}
.lh-sub{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:4px}
.lh-sub .ic{margin-right:4px;color:var(--gold)}
.stripe{height:6px;background:linear-gradient(90deg,var(--green) 0 62%,var(--gold) 62% 100%)}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 24px 14px;border-bottom:4px solid var(--green);background:#fff}
.tb-l{display:flex;align-items:center;gap:12px}
.tb-ico{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--green),var(--green3));color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px rgba(13,92,64,.28)}
.tb-ico .ic{width:24px;height:24px}
.tb-l h1{margin:0;font-size:clamp(18px,3.6vw,23px);color:var(--navy);line-height:1.2}
.tb-l p{margin:0;font-size:13px;color:#4a6a8b}
.badge{display:inline-flex;align-items:center;gap:7px;background:var(--gold);color:var(--green);font-weight:800;padding:7px 16px;border-radius:40px;font-size:15px;letter-spacing:.4px;box-shadow:0 4px 12px rgba(219,166,38,.35)}
.body{padding:20px 24px 28px}
/* ---------- search ---------- */
.search-box{background:#f2f7fc;padding:18px 20px;border-radius:18px;border:1px solid #dbe6f3}
.search-box h2{margin:0 0 2px;font-size:19px;color:var(--navy);display:flex;align-items:center;gap:8px}
.search-box h2 .ic{color:var(--green)}
.search-box>p{margin:0 0 12px;color:var(--mute);font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px;color:#35453d}
.field{position:relative}
.field .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#7d93ad;width:20px;height:20px;pointer-events:none}
input[type=text],input[type=tel]{width:100%;padding:13px 16px 13px 46px;font-size:17px;border:2px solid #cbdae9;border-radius:40px;outline:none;transition:.2s;background:#fff;letter-spacing:.4px;font-family:inherit}
input:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(26,107,63,.15)}
.go{width:100%;margin-top:14px;display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;background:linear-gradient(180deg,var(--green3),var(--green));color:#fff;font-size:17px;font-weight:700;padding:13px;border-radius:40px;cursor:pointer;box-shadow:0 8px 20px rgba(13,92,64,.3);transition:.25s}
.go:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 12px 26px rgba(13,92,64,.36)}
.go:disabled{opacity:.7;cursor:wait;transform:none}
.msg{margin-top:12px;padding:11px 14px;border-radius:12px;font-size:14px;display:none;align-items:center;gap:9px}
.msg .ic{width:20px;height:20px}
.msg.err{background:#fee9e7;color:#b33a34;border-left:6px solid #b33a34;animation:shake .4s}
.msg.info{background:#eaf3ff;color:#1d4f86;border-left:6px solid #1d4f86}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.hint{font-size:12px;color:var(--mute);margin-top:5px;padding-left:6px}
.secure{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;color:var(--mute);margin-top:12px}
.secure .ic{color:var(--green)}
/* ---------- result ---------- */
#result{display:none;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.who{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(145deg,var(--navy),var(--navy2));color:#fff;padding:16px 22px;border-radius:18px 18px 0 0}
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green3));color:#fff;display:grid;place-items:center;font:700 21px Georgia,serif;border:3px solid var(--gold);flex:none}
.wtxt{flex:1;min-width:160px}.wtxt small{display:block;font-size:12px;opacity:.75}
.who h2{margin:0;font-size:clamp(18px,4.2vw,23px);line-height:1.2}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:30px;padding:4px 13px;font-size:13px}
.chip .ic{color:var(--gold)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tabs button{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--line);background:#fff;border-radius:30px;padding:7px 15px;font-weight:600;color:#35453d;cursor:pointer;font-size:14px;transition:.2s}
.tabs button:hover{border-color:var(--green)}
.tabs button.on{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 6px 14px rgba(13,92,64,.25)}
.tabpane.on{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.hero{display:grid;grid-template-columns:190px 1fr;gap:18px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:16px;background:linear-gradient(135deg,#f6fbf8,#fff)}
.gauge{position:relative;width:170px;height:170px;margin:0 auto}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge svg.ic{all:unset}
.gauge .bg{stroke:#e3ece7}
.gauge .fg{stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.gauge .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .c b{font-size:33px;line-height:1;letter-spacing:-.5px}
.gauge .c span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.8px;margin-top:3px}
.gauge .c b span{font-size:inherit;color:inherit;text-transform:none;letter-spacing:inherit;margin:0}
.verdict{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;border-radius:30px;font-size:18px;font-weight:800;letter-spacing:.5px}
.verdict .ic{width:22px;height:22px;stroke-width:3}
.verdict.pass{background:#e6f6ee;color:#0f6a43;border:2px solid #a6dcc2;animation:pop .6s .3s both}
.verdict.fail{background:#fdecea;color:#a3281c;border:2px solid #f1b8b1;animation:pop .6s .3s both}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.heroTxt .note{margin:10px 0 0;font-size:14px;color:#44544b}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}
.tile{background:var(--tint);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;transition:.2s}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(13,92,64,.12)}
.tile .ic{width:20px;height:20px;color:var(--gold);display:block;margin:0 auto 3px}
.tile small{display:block;color:var(--mute);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px}
.tile b{font-size:21px;color:var(--green);display:block;line-height:1.25}
.tile em{font-style:normal;font-size:11px;color:var(--mute)}
h3.sec{margin:20px 0 8px;font-size:15px;color:var(--navy);text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:8px}
h3.sec .ic{color:var(--green);width:19px;height:19px}
h3.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{background:#e8f0fe;color:var(--navy);text-align:left;padding:11px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;white-space:nowrap;border-bottom:3px solid var(--navy2)}
td{padding:9px 12px;border-bottom:1px solid #e2ebf6;vertical-align:middle}
tbody tr{transition:.15s}tbody tr:hover td{background:#f5f9ff}
tr:last-child td{border-bottom:0}
td.n{width:36px;color:var(--mute)}
td.m{font-weight:700;white-space:nowrap;text-align:right;width:70px}
td.g{width:60px;text-align:center}
.bar{height:9px;border-radius:6px;background:#e7eeea;min-width:80px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.gr{display:inline-block;min-width:30px;padding:1px 8px;border-radius:8px;font-weight:800;font-size:13px;color:#fff}
.star{color:var(--gold);margin-left:5px}
.star .ic{width:15px;height:15px;fill:currentColor}
.ins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ins div{border-radius:14px;padding:10px 14px;border:1px solid var(--line);font-size:14px}
.ins .up{background:#eefaf3;border-color:#bfe5cf}.ins .dn{background:#fff6ea;border-color:#f3d9ae}
.ins small{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.ins .up small .ic{color:var(--gold);fill:currentColor}.ins .dn small .ic{color:var(--warn)}
.ins b{font-size:15px}
.prog{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:130px 1fr 128px;gap:10px;align-items:center;font-size:14px}
.prow .bar{height:14px}
.dlt{font-weight:800;text-align:right;white-space:nowrap}
.up-c{color:var(--good)}.dn-c{color:var(--bad)}.eq-c{color:var(--mute)}
.scale{display:flex;flex-wrap:wrap;gap:6px}
.scale span{font-size:12px;background:var(--tint);border:1px solid var(--line);border-radius:20px;padding:2px 10px;color:#35453d}
.scale i{font-style:normal;display:inline-block;color:#fff;border-radius:6px;padding:0 6px;margin-right:5px;font-weight:800}
.sign{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-top:30px;flex-wrap:wrap}
.sign .l{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.sign .p{min-width:210px;text-align:center}
.sign .p i{display:block;border-top:1.5px solid #2b3a33;margin-bottom:4px;height:34px}
.sign .p b{display:block}
.actions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.actions button{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--green);background:#fff;color:var(--green);font-weight:700;border-radius:40px;padding:10px 24px;cursor:pointer;font-size:15px;transition:.2s}
.actions button:hover{transform:translateY(-2px)}
.actions button.fill{background:var(--green);color:#fff;box-shadow:0 8px 18px rgba(13,92,64,.28)}
.foot{margin-top:22px;text-align:center;font-size:12px;color:#6a7f9b;border-top:2px solid #e2ebf6;padding-top:16px}
.foot strong{color:var(--navy)}
button:focus-visible,input:focus-visible{outline:3px solid rgba(219,166,38,.7);outline-offset:2px}
@media (max-width:640px){.titlebar,.body{padding-left:14px;padding-right:14px}.hero{grid-template-columns:1fr;text-align:center}.tiles{grid-template-columns:repeat(2,1fr)}.tiles .tile:last-child{grid-column:span 2}.ins{grid-template-columns:1fr}.prow{grid-template-columns:90px 1fr 112px}th,td{padding:8px 7px;font-size:14px}.bar{min-width:46px}.who{flex-direction:column;align-items:flex-start;padding:14px 16px}.search-box{padding:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.gauge .fg,.bar i{transition:none}}
@media print{
  body{background:#fff}.wrap{padding:0;max-width:none}.langs,.search-box,.actions,.tabs,.foot .sec-note,#msg,.secure{display:none!important}
  .paper{box-shadow:none;border-radius:0;animation:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #result{display:block!important;animation:none}.tabpane{display:none}.tabpane.on{display:block;animation:none}.hero,.tile,table,.prow{break-inside:avoid}
  .gauge .fg,.bar i{transition:none}
  @page{size:A4;margin:12mm}
}
</style>
</head>

</svg>
<div class="wrap">
  <div class="langs"><button id="l-so" class="on" type="button"><svg class="ic"><use href="#i-globe"/></svg>Soomaali</button><button id="l-en" type="button"><svg class="ic"><use href="#i-globe"/></svg>English</button></div>
  <div class="paper">
    <div class="lh">
      <img id="lhimg" class="lh-img" src="letterhead.png" alt="Beder Primary and Intermediate School" style="display:none" onload="this.style.display='block';document.getElementById('lhtext').style.display='none'" onerror="this.remove()">
      <div class="lh-text" id="lhtext">
        <img id="logo" src="logo.jpg" alt="" onerror="this.style.display='none'">
        <div><div class="lh-name" id="school">Beder Primary and Intermediate School</div><div class="lh-sub" id="sub"></div></div>
      </div>
    </div>
    <div class="stripe"></div>
    <div class="titlebar">
      <div class="tb-l">
        <div class="tb-ico"><svg class="ic"><use href="#i-award"/></svg></div>
        <div><h1 id="title">Natiijada Imtixaanka</h1><p id="yearline"></p></div>
      </div>
      <div class="badge"><svg class="ic"><use href="#i-cal"/></svg><span id="badgeYear"></span></div>
    </div>
    <div class="body">
      <form class="search-box" id="form" autocomplete="off">
        <h2><svg class="ic"><use href="#i-search"/></svg><span id="t-h">Eeg natiijada ardayga</span></h2>
        <p id="t-p">Geli lambarka Admission-ka ardayga si aad u aragto natiijada imtixaanka.</p>
        <label for="adm" id="t-adm">Lambarka Admission-ka</label>
        <div class="field"><svg class="ic"><use href="#i-id"/></svg><input id="adm" type="text" inputmode="text" autocapitalize="characters" placeholder="tusaale: A1023" required autofocus></div>
        <div id="second" style="display:none">
          <label for="sec" id="t-sec"></label>
          <div class="field"><svg class="ic"><use href="#i-key"/></svg><input id="sec" type="tel" inputmode="numeric" maxlength="4"></div>
          <div class="hint" id="t-sech"></div>
        </div>
        <button class="go" id="go" type="submit"><svg class="ic"><use href="#i-search"/></svg><span>Eeg Natiijada</span></button>
        <div class="msg" id="msg"></div>

<script>

(function(){
'use strict';
var T={so:{title:'Natiijada Imtixaanka',h:'Eeg natiijada ardayga',p:'Geli lambarka Admission-ka ardayga si aad u aragto natiijada imtixaanka.',adm:'Lambarka Admission-ka',go:'Eeg Natiijada',wait:'Waa la raadinayaa...',
  nf:'Natiijo lama helin. Hubi lambarka Admission-ka (iyo xogta kale ee la weydiiyay), kadibna isku day mar kale.',load:'Xogta natiijada lama furi karo hadda. Fadlan dib isku day.',old:'Natiijada lama soo gelin weli.',
  phone:'4-ta lambar ee ugu dambeysa ee telefoonka waalidka',phoneh:'Tusaale: haddii telefoonku yahay 061 234 5678, qor 5678',year:'Sanadka dhalashada ardayga (4 lambar)',yearh:'Tusaale: 2014',
  sname:'Magaca Ardayga',cls:'Fasalka',admno:'Lambarka Admission',yr:'Sannadka',subj:'Maaddada',mark:'Dhibcaha',grade:'Qiimo',total:'Wadarta',avg:'Celcelis',qual:'Qiimaynta',nsub:'Maaddooyin',rank:'Heerka',pos:'Kaalinta',of:'ka mid ah',
  pass:'GUDBAY',failv:'MA GUDBIN',passnote:'Hambalyo! Waxaad gaartay heerka lagu gudbayo.',secure:'Xogta waa la sir-gareeyay: ardayga keliya ayaa arki kara natiijadiisa.',failnote:'Maaddooyinka hoose waxay u baahan yihiin dedaal dheeraad ah: ',pm:'Gudbay',
  best:'Maaddada ugu xooggan',worst:'U baahan dedaal',progress:'Horumarka imtixaanada',change:'Isbeddel',scale:'Qiimaynta xarfaha',print:'Daabac',again:'Ardayga kale',issued:'Taariikhda la soo saaray: ',principal:'Maamulaha Dugsiga',
  foot:'Natiijadan waxaa laga soo qaaday nidaamka maamulka dugsiga. Haddii aad ku aragto khalad, la xiriir maamulka dugsiga.',mean:'celcelis'},
 en:{title:'Examination Result',h:'View a student\'s result',p:'Enter the student\'s admission number to see the exam result.',adm:'Admission number',go:'View Result',wait:'Searching...',
  nf:'No result found. Check the admission number (and the other detail asked), then try again.',load:'The results cannot be opened right now. Please try again.',old:'No results have been published yet.',

  sname:'Student name',cls:'Class',admno:'Admission No.',yr:'Year',subj:'Subject',mark:'Marks',grade:'Grade',total:'Total',avg:'Average',qual:'Grade',nsub:'Subjects',rank:'Level',pos:'Position',of:'out of',
  pass:'PASSED',failv:'NOT PASSED',passnote:'Congratulations! You have reached the pass mark.',secure:'The data is encrypted: only the student can open his own result.',failnote:'These subjects need extra effort: ',pm:'Pass',
  best:'Strongest subject',worst:'Needs most effort',progress:'Progress across exams',change:'Change',scale:'Grading scale',print:'Print',again:'Another student',issued:'Date issued: ',principal:'School Principal',
  foot:'This result was taken from the school management system. If you see a mistake, please contact the school office.',mean:'average'}};
var GR=[{min:90,g:'A',so:'Aad u fiican',en:'Excellent',c:'#0f7a4f'},{min:80,g:'B',so:'Fiican',en:'Very good',c:'#1a8f5c'},{min:70,g:'C',so:'Wanaagsan',en:'Good',c:'#1c6ea4'},{min:60,g:'D',so:'Dhexdhexaad',en:'Fair',c:'#8a6d00'},{min:50,g:'E',so:'Gudbay',en:'Pass',c:'#d98a00'},{min:0,g:'F',so:'Hoos u dhac',en:'Below pass',c:'#c0392b'}];
var IC=function(n,c){return '<svg class="ic'+(c?' '+c:'')+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>'};
var lang=(function(){try{return localStorage.getItem('rs_lang')}catch(e){return null}})()||'so',DATA=null,CUR=null,tab=0;
var $=function(id){return document.getElementById(id)},enc=new TextEncoder(),dec=new TextDecoder();
var t=function(k){return T[lang][k]};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return x.toString(16).padStart(2,'0')}).join('')}
function scale(){var g=DATA&&DATA.meta&&DATA.meta.grades;return (g&&g.length?g:GR).slice().sort(function(a,b){return b.min-a.min})}
function gradeOf(v){var s=scale();for(var i=0;i<s.length;i++)if(v>=s[i].min)return s[i];return s[s.length-1]}
function gname(g){return lang==='en'?(g.en||g.so):(g.so||g.en)}
function lbl(e){return lang==='en'&&e.label_en?e.label_en:e.label}
function setLang(l){lang=l;try{localStorage.setItem('rs_lang',l)}catch(e){}
  $('l-so').className=l==='so'?'on':'';$('l-en').className=l==='en'?'on':'';document.documentElement.lang=l;
  $('title').textContent=t('title');$('t-h').textContent=t('h');$('t-p').textContent=t('p');$('t-adm').textContent=t('adm');$('t-sec2').textContent=t('secure');$('go').innerHTML=IC('search')+'<span>'+esc(t('go'))+'</span>';
  $('print').innerHTML=IC('print')+'<span>'+esc(t('print'))+'</span>';$('again').innerHTML=IC('back')+'<span>'+esc(t('again'))+'</span>';if(!DATA)$('foot').innerHTML='<strong>\u00A9 2026 MusApps</strong> All rights reserved.<br><span>'+esc(t('foot'))+'</span>';
  if(DATA){applyMeta();}
  if(CUR)render();}
function applyMeta(){var m=DATA.meta;$('school').textContent=m.school||'Beder Primary and Intermediate School';$('badgeYear').textContent=(m.academic_year||'');$('sub').innerHTML=[m.location?IC('pin')+esc(m.location):'',m.phone?IC('phone')+esc(m.phone):''].filter(Boolean).join('');
  $('yearline').textContent=m.academic_year?t('yr')+' '+m.academic_year:'';
  document.title=t('title')+' | '+(m.school||'Beder Primary and Intermediate School');
  $('foot').innerHTML='<strong>\u00A9 2026 MusApps</strong> All rights reserved.<br><span>'+esc(t('foot'))+'</span>';
  var sf=m.second_factor||'none';$('second').style.display=sf==='none'?'none':'block';
  if(sf==='phone_last4'){$('t-sec').textContent=t('phone');$('t-sech').textContent=t('phoneh')}
  if(sf==='birth_year'){$('t-sec').textContent=t('year');$('t-sech').textContent=t('yearh')}}
function msg(kind,text){var m=$('msg');m.className='msg '+(kind||'');m.innerHTML=text?IC(kind==='err'?'alert':'info')+'<span>'+esc(text)+'</span>':'';m.style.display=kind?'flex':'none'}
async function load(){
  try{var r=await fetch('results.json',{cache:'no-cache'});if(!r.ok)throw 0;DATA=await r.json();applyMeta();
    if(!DATA.students||!Object.keys(DATA.students).length)msg('info',t('old'));}
  catch(e){msg('err',t('load'))}}
async function hmacKey(raw,usage){return crypto.subtle.importKey('raw',raw,{name:'HMAC',hash:'SHA-256'},false,usage)}
async function open(adm,second){
  var K=DATA.kdf,idh=hex(await crypto.subtle.digest('SHA-256',enc.encode(K.index_salt+':'+adm))).slice(0,32),rec=DATA.students[idh];
  if(!rec)return null;
  var material=adm+(DATA.meta.second_factor&&DATA.meta.second_factor!=='none'?'|'+second:'');
  var base=await crypto.subtle.importKey('raw',enc.encode(material),'PBKDF2',false,['deriveBits']);
  var bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(rec.s),iterations:K.iter},base,512));
  var nonce=b64(rec.n),ct=b64(rec.c),mk=await hmacKey(bits.slice(32),['verify']);
  var buf=new Uint8Array(nonce.length+ct.length);buf.set(nonce);buf.set(ct,nonce.length);
  if(!(await crypto.subtle.verify('HMAC',mk,b64(rec.t),buf)))return null;
  var ek=await hmacKey(bits.slice(0,32),['sign']),out=new Uint8Array(ct.length);
  for(var i=0;i*32<ct.length;i++){var blk=new Uint8Array(nonce.length+4);blk.set(nonce);new DataView(blk.buffer).setUint32(nonce.length,i,false);
    var ks=new Uint8Array(await crypto.subtle.sign('HMAC',ek,blk));for(var j=0;j<32&&i*32+j<ct.length;j++)out[i*32+j]=ct[i*32+j]^ks[j]}
  return JSON.parse(dec.decode(out));}
function norm(s){return String(s).normalize('NFKC').replace(/\s+/g,'').toUpperCase()}
function initials(n){var p=String(n).trim().split(/\s+/);return ((p[0]||'')[0]||'')+((p.length>1?p[p.length-1][0]:'')||'')}
function colorOf(v,pm){return v>=80?'#1a8f5c':v>=pm?(v>=65?'#1c6ea4':'#d98a00'):'#c0392b'}
function gauge(avg,pm){var R=52,C=2*Math.PI*R,col=colorOf(avg,pm);
  return '<div class="gauge"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="'+R+'" fill="none" stroke-width="11"/><circle class="fg" cx="60" cy="60" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="11" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+C.toFixed(1)+'" data-off="'+(C*(1-Math.max(0,Math.min(100,avg))/100)).toFixed(1)+'"/></svg>'
   +'<div class="c"><b style="color:'+col+'"><span data-count="'+avg+'">'+avg+'</span>%</b><span>'+t('mean')+'</span></div></div>'}
function render(){var m=DATA.meta,s=CUR,ex=s.exams,pm=m.pass_mark;if(tab>=ex.length)tab=0;
  $('who').innerHTML='<div class="avatar">'+esc(initials(s.name).toUpperCase())+'</div><div class="wtxt"><small>'+t('sname')+'</small><h2>'+esc(s.name)+'</h2></div><div class="chips"><span class="chip">'+IC('school')+t('cls')+': <b>'+esc(s.class)+'</b></span><span class="chip">'+IC('id')+t('admno')+': <b>'+esc(s.admission_no)+'</b></span><span class="chip">'+IC('cal')+t('yr')+': <b>'+esc(m.academic_year||'')+'</b></span></div>';
  $('tabs').innerHTML=ex.length>1?ex.map(function(e,i){return '<button type="button" class="'+(i===tab?'on':'')+'" data-i="'+i+'">'+IC('doc')+esc(lbl(e))+'</button>'}).join(''):'';
  $('panes').innerHTML=ex.map(function(e,i){
    var subs=e.subjects,gi=gradeOf(e.average),hi=subs.reduce(function(a,x){return x.m>a.m?x:a},subs[0]),lo=subs.reduce(function(a,x){return x.m<a.m?x:a},subs[0]),
    failed=subs.filter(function(x){return x.m<pm}).map(function(x){return x.n});
    var rows=subs.map(function(x,j){var g=gradeOf(x.m),w=Math.max(0,Math.min(100,x.m)),bad=x.m<pm;
      return '<tr><td class="n">'+(j+1)+'</td><td>'+esc(x.n)+(subs.length>1&&x===hi?'<span class="star" title="'+esc(t('best'))+'">'+IC('star')+'</span>':'')+'</td><td style="width:32%"><div class="bar"><i data-w="'+w+'" style="background:'+(bad?'var(--bad)':colorOf(x.m,pm))+'"></i></div></td><td class="m'+(bad?' fail':'')+'" style="'+(bad?'color:var(--bad)':'')+'">'+x.m+'</td><td class="g"><span class="gr" style="background:'+g.c+'">'+esc(g.g)+'</span></td></tr>'}).join('');
    var tiles='<div class="tile">'+IC('sum')+'<small>'+t('total')+'</small><b>'+e.total+'</b><em>/ '+(subs.length*100)+'</em></div><div class="tile">'+IC('chart')+'<small>'+t('avg')+'</small><b>'+e.average+'%</b><em>&nbsp;</em></div>'
      +'<div class="tile">'+IC('award')+'<small>'+t('qual')+'</small><b style="color:'+gi.c+'">'+esc(gi.g)+'</b><em>'+esc(gname(gi))+'</em></div><div class="tile">'+IC('book')+'<small>'+t('nsub')+'</small><b>'+subs.length+'</b><em>&nbsp;</em></div>'
      +(m.show_rank&&e.rank?'<div class="tile">'+IC('trophy')+'<small>'+t('rank')+'</small><b>'+e.rank+'</b><em>'+t('of')+' '+e.of+'</em></div>':'<div class="tile">'+IC('check')+'<small>'+t('pm')+'</small><b>'+pm+'%</b><em>&nbsp;</em></div>');
    return '<div class="tabpane '+(i===tab?'on':'')+'" style="'+(i===tab?'':'display:none')+'" data-p="'+i+'"><div class="hero">'+gauge(e.average,pm)+'<div class="heroTxt"><div class="verdict '+(e.pass?'pass':'fail')+'">'+(e.pass?IC('check')+t('pass'):IC('x')+t('failv'))+'</div>'
     +'<p class="note">'+(e.pass?t('passnote'):'')+(failed.length?(e.pass?' ':'')+t('failnote')+esc(failed.join(', ')):'')+'</p></div></div>'
     +'<div class="tiles">'+tiles+'</div>'
     +'<h3 class="sec">'+IC('list')+esc(lbl(e))+'</h3><div class="tw"><table><thead><tr><th>#</th><th>'+t('subj')+'</th><th></th><th style="text-align:right">'+t('mark')+'</th><th style="text-align:center">'+t('grade')+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
     +(subs.length>1&&hi.m!==lo.m?'<div class="ins"><div class="up"><small>'+IC('star')+t('best')+'</small><b>'+esc(hi.n)+' — '+hi.m+'</b></div><div class="dn"><small>'+IC('target')+t('worst')+'</small><b>'+esc(lo.n)+' — '+lo.m+'</b></div></div>':'')+'</div>'}).join('');
  var pr='';
  if(ex.length>1){
    var rowsP=ex.map(function(e,i){var d=i?Math.round((e.average-ex[i-1].average)*10)/10:null,cl=d==null?'':d>0?'up-c':d<0?'dn-c':'eq-c';
      return '<div class="prow"><span>'+esc(lbl(e))+'</span><div class="bar"><i data-w="'+e.average+'" style="background:'+colorOf(e.average,pm)+'"></i></div><span class="dlt '+cl+'">'+e.average+'%'+(d==null?'':' <small>'+(d>0?'▲ +':d<0?'▼ ':'= ')+d+'</small>')+'</span></div>'}).join('');
    var a=ex[0],b=ex[ex.length-1],cmp=b.subjects.map(function(x){var y=a.subjects.filter(function(z){return z.n===x.n})[0];return y?{n:x.n,a:y.m,b:x.m,d:Math.round((x.m-y.m)*10)/10}:null}).filter(Boolean);
    pr='<h3 class="sec">'+IC('trend')+t('progress')+'</h3><div class="prog">'+rowsP+'</div>'
      +(cmp.length?'<div class="tw" style="margin-top:12px"><table><thead><tr><th>'+t('subj')+'</th><th style="text-align:right">'+esc(lbl(a))+'</th><th style="text-align:right">'+esc(lbl(b))+'</th><th style="text-align:right">'+t('change')+'</th></tr></thead><tbody>'
        +cmp.map(function(c){return '<tr><td>'+esc(c.n)+'</td><td class="m">'+c.a+'</td><td class="m">'+c.b+'</td><td class="m '+(c.d>0?'up-c':c.d<0?'dn-c':'eq-c')+'">'+(c.d>0?'▲ +':c.d<0?'▼ ':'= ')+c.d+'</td></tr>'}).join('')+'</tbody></table></div>':'');}
  $('progress').innerHTML=pr;
  $('t-scale').innerHTML=IC('award')+esc(t('scale'));
  $('scale').innerHTML=scale().map(function(g,i,arr){var hiV=i?arr[i-1].min-1:100;return '<span><i style="background:'+g.c+'">'+esc(g.g)+'</i>'+g.min+(hiV>g.min?'–'+hiV:'+')+' · '+esc(gname(g))+'</span>'}).join('');
  $('issued').innerHTML=IC('cal')+esc(t('issued')+(m.generated||''));$('principal').textContent=m.principal||'';$('ptitle').textContent=t('principal');
  document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){tab=+b.dataset.i;render()}});
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    document.querySelectorAll('.gauge .fg').forEach(function(c){c.setAttribute('stroke-dashoffset',c.dataset.off)});
    document.querySelectorAll('.bar i').forEach(function(b){b.style.width=b.dataset.w+'%'});
    document.querySelectorAll('[data-count]').forEach(function(el){var to=parseFloat(el.dataset.count),t0=null;function f(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/900);el.textContent=(to*(1-Math.pow(1-p,3))).toFixed(1);if(p<1)requestAnimationFrame(f);else el.textContent=el.dataset.count}
      if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)el.textContent=el.dataset.count;else requestAnimationFrame(f)})})});}
$('form').addEventListener('submit',async function(ev){ev.preventDefault();msg();if(!DATA){await load();if(!DATA)return}
  var adm=norm($('adm').value),sf=DATA.meta.second_factor||'none',sec='';
  if(!adm)return;
  if(sf==='phone_last4'){sec=$('sec').value.replace(/\D/g,'').slice(-4);if(sec.length<4)return msg('err',t('nf'))}
  if(sf==='birth_year'){var y=($('sec').value.match(/\d{4}/)||[''])[0];sec=y;if(!y)return msg('err',t('nf'))}
  var b=$('go');b.disabled=true;b.innerHTML=IC('spin','spin')+'<span>'+esc(t('wait'))+'</span>';
  try{CUR=await open(adm,sec)}catch(e){CUR=null}
  b.disabled=false;b.innerHTML=IC('search')+'<span>'+esc(t('go'))+'</span>';
  if(!CUR||!CUR.exams||!CUR.exams.length)return msg('err',t('nf'));
  tab=0;$('form').style.display='none';$('result').style.display='block';render();window.scrollTo(0,0)});
$('again').onclick=function(){CUR=null;$('result').style.display='none';$('form').style.display='block';$('adm').value='';$('sec').value='';$('adm').focus()};
$('print').onclick=function(){window.print()};
$('l-so').onclick=function(){setLang('so')};$('l-en').onclick=function(){setLang('en')};
setLang(lang);load();
})();
